

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpass

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jpa:
          defer-datasource-initialization: true   # IMPORTANT: run schema.sql before JPA uses the DB

# OpenAI API (embeddings + chat). Set OPENAI_API_KEY env var or openai.api-key in config.
openai:
  api-key: ${OPENAI_API_KEY:}
  embed-model: "text-embedding-3-small"
  chat-model: "gpt-4o-mini"

rag:
  chunk-size: 800
  chunk-overlap: 150
  top-k: 6
